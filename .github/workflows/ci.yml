name: iOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only the newest run per branch survives. A full round costs about 150
# runner minutes, so letting superseded commits finish just burns quota on
# results nobody reads — and with several rounds in flight the macOS
# concurrency cap makes even the current one queue behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode 26.6 and the iOS 26.5 runtime are both preinstalled on macos-26, and
  # 26.6 matches the local toolchain. A runtime may be older than the Xcode
  # driving it but never newer, which is why the previous 26.1.1 pin could not
  # use anything the image shipped and paid ~15 minutes per job to download one.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DERIVED_DATA: /tmp/TiebaPureDerivedData

jobs:
  # Cheap gates that need no simulator. Everything else waits on this so a
  # drifted manifest fails in two minutes instead of two hours.
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify the change
        id: scope
        run: |
          # A prose-only change cannot break a build or a test, and a full
          # round costs ~35 minutes of a contributor's attention. The gates in
          # this job still run — one of them greps README.md — but the
          # simulator jobs are skipped. Anything unrecognised counts as code,
          # so a new path is never silently left untested.
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac

          # No usable base (first push, force push, zero SHA): treat as code.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the full round."
            exit 0
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qvE '^(docs/|\.github/ISSUE_TEMPLATE/|[^/]+\.md$)'; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "Code touched; running the full round."
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
            echo "Documentation only; skipping the simulator jobs."
          fi

      - name: Verify UI test whitelist matches test source
        run: |
          # The whitelist regex requires a word character after "test", so the
          # pattern literal in this step never matches itself.
          source_tests="$(grep -oE 'func test[A-Za-z0-9_]+' TiebaPureUITests/TiebaPureUITests.swift | sed 's/^func //' | sort -u)"
          workflow_tests="$(grep -oE 'only-testing:TiebaPureUITests/TiebaPureUITests/test[A-Za-z0-9_]+' .github/workflows/ci.yml | sed 's#.*/##' | sort -u)"
          if ! diff <(printf '%s\n' "$source_tests") <(printf '%s\n' "$workflow_tests"); then
            echo "ci.yml -only-testing whitelist has drifted from TiebaPureUITests.swift." >&2
            echo "Lines marked < are missing from ci.yml; lines marked > no longer exist in the test source." >&2
            exit 1
          fi
          echo "ci.yml whitelist covers all $(printf '%s\n' "$source_tests" | wc -l | tr -d ' ') UI tests."

      - name: Select toolchain
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Regenerate canonical project
        run: |
          xcodegen generate --spec project.yml
          if ! git diff --exit-code -- TiebaPure.xcodeproj; then
            echo "::error::TiebaPure.xcodeproj does not match project.yml. The project file is generated and committed: run 'xcodegen generate --spec project.yml' and commit the result. If the diff looks unrelated to your change, check that your XcodeGen is 2.45.x — a different version regenerates the file differently." >&2
            exit 1
          fi

      - name: Verify source and attribution manifests
        run: |
          # Protos/TiebaPureProfile is original to this project; the 302-file
          # assertion pins only the schemas copied from TiebaLite.
          test "$(find Protos -type f -name '*.proto' -not -path 'Protos/TiebaPureProfile/*' | wc -l | tr -d ' ')" = "302"
          grep -Fq '4.0-dev@2885b2aabbbf47aba7bf12b1cd7cbc03b1f5ec15' README.md
          grep -Fq '4.0-dev@2885b2aabbbf47aba7bf12b1cd7cbc03b1f5ec15' THIRD_PARTY_NOTICES.md
          grep -Fq '2885b2aabbbf47aba7bf12b1cd7cbc03b1f5ec15' Protos/README.md
          grep -Fq 'https://github.com/infinityf4p/TiebaPure-iOS' TiebaPure/Features/Profile/AboutView.swift
          ./scripts/generate-asset-manifest.sh
          if ! git diff --exit-code -- ASSET_MANIFEST.sha256; then
            echo "::error::ASSET_MANIFEST.sha256 is out of date. It records the provenance of every bundled asset: run './scripts/generate-asset-manifest.sh' and commit the result. If you added an asset, say where it came from in the PR — assets of unknown provenance cannot be accepted." >&2
            exit 1
          fi
          test "$(grep -c '^tiebalite-exact  ' ASSET_MANIFEST.sha256)" = "51"
          test "$(grep -c '^unknown-license  ' ASSET_MANIFEST.sha256)" = "54"

      - name: Verify committed protobuf schemas match Protos
        run: |
          PROTOC_VERSION="31.1"
          SWIFT_PROTOBUF_VERSION="1.38.1"
          TOOLS_DIR="$RUNNER_TEMP/proto-tools"
          mkdir -p "$TOOLS_DIR"

          curl -fsSL --retry 3 -o "$TOOLS_DIR/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOC_VERSION/protoc-$PROTOC_VERSION-osx-universal_binary.zip"
          /usr/bin/unzip -q -o "$TOOLS_DIR/protoc.zip" -d "$TOOLS_DIR/protoc"
          test "$("$TOOLS_DIR/protoc/bin/protoc" --version)" = "libprotoc $PROTOC_VERSION"

          git clone --depth 1 --branch "$SWIFT_PROTOBUF_VERSION" \
            https://github.com/apple/swift-protobuf.git "$TOOLS_DIR/swift-protobuf"
          (cd "$TOOLS_DIR/swift-protobuf" && swift build -c release --product protoc-gen-swift)

          # generate-ios-protos.sh hard-asserts the protoc-gen-swift version.
          PATH="$TOOLS_DIR/protoc/bin:$TOOLS_DIR/swift-protobuf/.build/release:$PATH" \
            ./scripts/generate-ios-protos.sh
          if ! git diff --exit-code -- TiebaPure/Core/Protobuf/Generated; then
            echo "::error::Generated protobuf sources do not match Protos/. Run './scripts/generate-ios-protos.sh' and commit the result. It needs protoc 31.1 and protoc-gen-swift 1.38.1 on PATH; the script asserts both versions." >&2
            exit 1
          fi
          test -z "$(git status --porcelain -- TiebaPure/Core/Protobuf/Generated)"

  unit-tests:
    needs: verify
    if: needs.verify.outputs.docs-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot pinned simulator
        run: |
          source scripts/ci-simulator.sh
          ci_install_runtime
          udid="$(ci_create_simulator "$(ci_iphone_device_type)" 'TiebaPure CI Unit')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          # Simulator XCTest must run normally signed. Never pass
          # CODE_SIGNING_ALLOWED=NO here: the Keychain regression tests lose
          # their meaning without the entitlement.
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            test -only-testing:TiebaPureTests \
            -skip-testing:TiebaPureTests/AnonymousLiveSmokeTests

  # Shards run as parallel jobs, each on its own freshly booted simulator —
  # what the sharding was for, since XCUITest accessibility queries start
  # timing out after enough app relaunches in one runner.
  #
  # Sized from measured per-test durations rather than by test count. Each job
  # carries ~9.7 minutes of fixed cost (boot, build, reset), and the macOS
  # concurrency cap means only ~3.6 jobs actually run at once, so wall-clock
  # time tracks total runner minutes and every extra shard makes the round
  # slower, not faster. Four balanced shards keep each one at or below the 21
  # tests the largest shard already ran safely, while cutting the spread from
  # 6.1-11.6 minutes of tests down to 10.0-10.1.
  #
  # reselect stays on its own: those two tests hold the refresh indicator for
  # ten seconds via UITEST_RESELECT_REFRESH_HOLD.
  ui-tests:
    needs: verify
    if: needs.verify.outputs.docs-only != 'true'
    # Without this, GitHub builds the job name from every matrix key, so each
    # shard is labelled with its entire -only-testing list.
    name: ui-tests (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reselect
            tests: >-
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectAfterScrollingRefreshesContent
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeTabReselectInterruptsPaginationAndRefreshesImmediately
          - name: shard-a
            tests: >-
              -only-testing:TiebaPureUITests/TiebaPureUITests/testAppearanceSettingWorksForGuestAndPersistsAcrossRelaunch
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFailedInlineImageRetryDoesNotOpenOrClosePreview
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFixtureErrorStateOffersAccessibleRetry
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFixtureMediaCountMatrixIsAccessible
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumListMediaIsDecorativeAndWholeRowOpensThread
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumUserProfileRightSwipeReturnsOnlyToForum
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFullScreenImageRejectsSwipeDismissalButSingleTapReturns
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFullScreenImageTransitionHandlesCroppedThumbnailAndOriginalRatio
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLandscapeHomeAndSearchLayout
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLargeLikeCountsStayOnOneLineAtTheTrailingEdge
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPrivateUserProfileShowsExplicitPrivacyStates
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPullingEmptyForumStateLoadsContent
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSearchResultRoutesToMatchedReply
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSearchUserProfileRightSwipeReturnsOnlyToSearch
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSearchUsesSystemBackSwipeToPreviousPage
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSyntheticScreenshotMatrix
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadDetailUsesSystemBackSwipeToPreviousPage
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadFavoriteAppearsInMeAndReopensIt
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadLevelBadgeStaysOnOneLine
              -only-testing:TiebaPureUITests/TiebaPureUITests/testUserProfileThreadRightSwipeReturnsOnlyToUserProfile
          - name: shard-b
            tests: >-
              -only-testing:TiebaPureUITests/TiebaPureUITests/testAboutShowsTiebaLiteAttributionAndGPL
              -only-testing:TiebaPureUITests/TiebaPureUITests/testBrowsingHistoryThreadRightSwipeKeepsEveryRouteAcrossRepeatedCycles
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFollowedForumWholeRowNavigatesWithoutGestureConflict
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForegroundBackgroundKeepsFixtureContent
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumHubAndMeKeepLoginOutOfHome
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumLatestMenuSwitchesReplyPublishAndFeaturedCategories
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFullScreenImageOffersDownloadAndTapReturnsToSource
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeImageStaysAlignedAcrossRapidDismissAndScrollCycles
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeImageStaysAlignedAfterPreviewDismissAndScrollReuse
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanOpenFollowedUsersFromMe
              -only-testing:TiebaPureUITests/TiebaPureUITests/testMessagesGuestPromptAndLoggedInFixtureJourney
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPullingHomeFeedRefreshesContentAndPreservesExistingRows
              -only-testing:TiebaPureUITests/TiebaPureUITests/testReplyFirstLineGlyphsRemainVisibleAfterScrollReuse
              -only-testing:TiebaPureUITests/TiebaPureUITests/testRightSwipeOnThreadImageDismissesWithoutOpeningPreview
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSavedReadingPositionAutoRestoresAndReturnsToTop
              -only-testing:TiebaPureUITests/TiebaPureUITests/testShortPullRefreshesThreadDetailAtSameDistanceAsHome
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostPreviewLayoutRemainsStableAfterNativeBackRoundTrip
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSwitchingToHomeDoesNotTriggerReselectRefresh
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadShortRightDragCancelsWithoutChangingRoute
          - name: shard-c
            tests: >-
              -only-testing:TiebaPureUITests/TiebaPureUITests/testFixtureEmptyStateIsDeterministic
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumCategoryRaceKeepsOnlyLatestSelection
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumToolbarSearchRefreshAndBlockBehaviors
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeImageCanScrollInTheFirstPostDismissalFrameWithoutMovingTheThumbnailLayer
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeOpensAnotherImageOnFirstTapAfterDismissal
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInAccountHeaderOpensOwnUserProfile
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanLikeThreadReplyAndSubpost
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLoggedInUserCanToggleProfileFollowState
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPaginationFailureKeepsContentAndRetriesSamePage
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPullingDownAwayFromHomeTopDoesNotRefresh
              -only-testing:TiebaPureUITests/TiebaPureUITests/testRemoteImageReplacesBitmapWhenReusableViewChangesURL
              -only-testing:TiebaPureUITests/TiebaPureUITests/testRootTabsRestoreAfterReturningFromFollowedUserProfileAndThread
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSearchBackButtonDismissesFocusedSearchInOneStepAndHistoryPersists
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostPreviewLayoutRemainsStableAfterProfileRoundTrip
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostUserProfileRightSwipeReturnsOnlyToSubpostSheet
              -only-testing:TiebaPureUITests/TiebaPureUITests/testTallInlineImageOffersOriginalEntry
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadAuthorOpensPublicUserProfile
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadDetailMainReplyAndSubpostsWrapWithoutTruncation
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadLevelBadgeStaysOnOneLineAtAccessibilityXXXL
              -only-testing:TiebaPureUITests/TiebaPureUITests/testVerifiedLoginSkipPasswordStaysInAppAndPublishesAccount
          - name: shard-d
            tests: >-
              -only-testing:TiebaPureUITests/TiebaPureUITests/testDiagonalRightSwipeAtHomeTopDoesNotTriggerRefresh
              -only-testing:TiebaPureUITests/TiebaPureUITests/testEmptyFilteredSearchKeepsControlsAvailable
              -only-testing:TiebaPureUITests/TiebaPureUITests/testExpandedSubpostUsesSecondaryInteractiveUserNames
              -only-testing:TiebaPureUITests/TiebaPureUITests/testForumThreadUserProfileRightSwipeNeverSkipsThread
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeAndThreadRefreshKeepTopIndicatorsVisible
              -only-testing:TiebaPureUITests/TiebaPureUITests/testHomeForumMenuBlocksThreadWhoseForumNameIsMissing
              -only-testing:TiebaPureUITests/TiebaPureUITests/testLaunchShowsHomeWithoutLoginAndRootTabs
              -only-testing:TiebaPureUITests/TiebaPureUITests/testMeFollowRowsMatchBrowsingRowHeight
              -only-testing:TiebaPureUITests/TiebaPureUITests/testPostHTTPSLinkExposesNativeLinkTrait
              -only-testing:TiebaPureUITests/TiebaPureUITests/testRepeatedUserProfileRightSwipesNeverSkipTheThread
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostPreviewAuthorAndReplyTargetOpenIndependentProfiles
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostPreviewSeparatesRepliesWithoutExpandingOpenAllButton
              -only-testing:TiebaPureUITests/TiebaPureUITests/testSubpostRightSwipeDismissesTheWholeSheet
              -only-testing:TiebaPureUITests/TiebaPureUITests/testTappingThreadImageStillOpensPreview
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadDetailShowsReplyControls
              -only-testing:TiebaPureUITests/TiebaPureUITests/testThreadDetailTextSupportsNativeCopySelection
              -only-testing:TiebaPureUITests/TiebaPureUITests/testUserProfileMiddleRightSwipeReturnsOnlyOneLevelToThread
              -only-testing:TiebaPureUITests/TiebaPureUITests/testUserProfileSourceThreadReturnsToExistingThreadWithoutDuplicatePush
              -only-testing:TiebaPureUITests/TiebaPureUITests/testViewingThreadAddsBrowsingHistoryInMeAndReopensIt
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot pinned simulator
        run: |
          source scripts/ci-simulator.sh
          ci_install_runtime
          udid="$(ci_create_simulator "$(ci_iphone_device_type)" 'TiebaPure CI ${{ matrix.name }}')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build UI tests
        run: |
          xcodebuild build-for-testing \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:TiebaPureUITests

      - name: Reset simulator before testing
        run: |
          # The device has been booted through the whole build by now. The
          # single-job workflow always tested on a device created after the
          # build, and dropping that is what let the runner abort during
          # bootstrap.
          source scripts/ci-simulator.sh
          udid="$(ci_reset_simulator "$SIMULATOR_UDID" "$(ci_iphone_device_type)" 'TiebaPure CI ${{ matrix.name }} run')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Fixture UI tests (${{ matrix.name }})
        run: |
          # XCUITest against this app is timing-sensitive: the refresh
          # indicator animates at 30 Hz while tests query it, so accessibility
          # snapshots occasionally time out or read back a stale result. Retry
          # a failing test once instead of failing the whole run on it. A real
          # regression fails both attempts, so this hides flakiness without
          # hiding breakage. Retries relaunch the test process, because the
          # snapshot timeouts accumulate across app restarts within a runner.
          xcodebuild test-without-building \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            ${{ matrix.tests }}

  ui-tests-ipad:
    needs: verify
    if: needs.verify.outputs.docs-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot pinned iPad simulator
        run: |
          source scripts/ci-simulator.sh
          ci_install_runtime
          device_type="$(ci_ipad_device_type)"
          test -n "$device_type"
          udid="$(ci_create_simulator "$device_type" 'TiebaPure CI iPad')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build UI tests
        run: |
          xcodebuild build-for-testing \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:TiebaPureUITests

      - name: Reset simulator before testing
        run: |
          source scripts/ci-simulator.sh
          udid="$(ci_reset_simulator "$SIMULATOR_UDID" "$(ci_ipad_device_type)" 'TiebaPure CI iPad run')"
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Fixture UI tests (iPad)
        run: |
          UI_LOG="$(mktemp)"
          xcodebuild test-without-building \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testIPadTabBarBlankSpaceDoesNotSelectOrRefreshHome \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testIPadHomeThreadTitleAndSummaryBothOpenDetail \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testIPadForumThreadOpensSharedDetailInsteadOfLeadingLocalStack \
            2>&1 | tee "$UI_LOG"
          test "${PIPESTATUS[0]}" -eq 0
          # XCTSkip exits 0; a skip here means the iPad-only guard never ran.
          if grep -Eq "Test [Cc]ase .* skipped" "$UI_LOG"; then
            echo "iPad-only UI tests were skipped instead of executed." >&2
            exit 1
          fi

  ui-tests-reduce-motion:
    needs: verify
    if: needs.verify.outputs.docs-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Boot pinned simulator with Reduce Motion
        run: |
          source scripts/ci-simulator.sh
          ci_install_runtime
          udid="$(ci_create_simulator "$(ci_iphone_device_type)" 'TiebaPure CI Reduce Motion')"
          test -n "$udid"

          # The accessibility preference must be in place before the test
          # runner boots, so write it and restart the simulator.
          xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
          xcrun simctl shutdown "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          test "$(xcrun simctl spawn "$udid" defaults read com.apple.Accessibility ReduceMotionEnabled)" = "1"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build UI tests
        run: |
          xcodebuild build-for-testing \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -only-testing:TiebaPureUITests

      - name: Fixture UI tests (Reduce Motion)
        run: |
          UI_LOG="$(mktemp)"
          xcodebuild test-without-building \
            -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -test-repetition-relaunch-enabled YES \
            -only-testing:TiebaPureUITests/TiebaPureUITests/testReduceMotionKeepsRefreshIndicatorStatic \
            2>&1 | tee "$UI_LOG"
          test "${PIPESTATUS[0]}" -eq 0
          # XCTSkip exits 0; a skip here means Reduce Motion never took effect.
          if grep -Eq "Test [Cc]ase .* skipped" "$UI_LOG"; then
            echo "The Reduce Motion UI test was skipped instead of executed." >&2
            exit 1
          fi

  analyze-and-release:
    needs: verify
    if: needs.verify.outputs.docs-only != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pinned iOS platform
        run: |
          # Guard, not a download: both destinations below need an installed
          # iOS platform, and pinning one the image did not carry is what made
          # this job fail in 40 seconds. With the preinstalled runtime this
          # returns immediately. No simulator is created — neither `analyze`
          # nor the release build boots one.
          source scripts/ci-simulator.sh
          ci_install_runtime

      - name: Static analysis
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" analyze CODE_SIGNING_ALLOWED=NO

      - name: Release build and privacy manifest
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" build CODE_SIGNING_ALLOWED=NO
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/TiebaPure.app"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
