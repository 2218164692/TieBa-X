name: TieBaX
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: com.tiebax
  deploymentTarget:
    iOS: "14.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
settings:
  base:
    # The source uses explicit existentials (`any`) and modern concurrency
    # syntax while all runtime APIs are guarded for the iOS 14 floor.
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 14.0
targets:
  TieBaX:
    type: application
    platform: iOS
    sources:
      - path: TieBaX
        excludes:
          - Resources/Info.plist
      - path: Assets.xcassets
        type: file
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: LICENSES/SwiftProtobuf-Apache-2.0.txt
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources

    dependencies:
      - target: TieBaXOpenIn
        embed: true
      - package: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiebax.ios
        PRODUCT_NAME: TieBa-X
        PRODUCT_MODULE_NAME: TieBaX
        INFOPLIST_FILE: TieBaX/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
  TieBaXOpenIn:
    type: app-extension
    platform: iOS
    sources:
      - path: TieBaXOpenIn
        excludes:
          - Info.plist
          - OpenInTieBaX.js
      - path: TieBaX/App/ExternalRoute.swift
      - path: TieBaX/App/SafariActionPayload.swift
      - path: TieBaXOpenIn/OpenInTieBaX.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiebax.ios.open-in
        PRODUCT_NAME: TieBa-X-OpenIn
        PRODUCT_MODULE_NAME: TieBaXOpenIn
        INFOPLIST_FILE: TieBaXOpenIn/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
  TieBaXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TieBaXCoreTests
        excludes:
          - ContentDraftMigrationTests.swift
          - ContentDraftTests.swift
          - StateRegressionTests.swift
          - SwiftDataOrderedCollectionPersistenceTests.swift
      - TieBaXTests
    dependencies:
      - target: TieBaX
      - package: SwiftProtobuf
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TieBaXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TieBaXUITestCases
      - TieBaXUITests
    dependencies:
      - target: TieBaX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TieBaX:
    build:
      targets:
        TieBaX: all
        TieBaXTests: [test]
        TieBaXUITests: [test]
    test:
      targets:
        - TieBaXTests
        - TieBaXUITests
