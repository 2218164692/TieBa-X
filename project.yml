name: TieBaX
options:
  minimumXcodeGenVersion: 2.45.0
  bundleIdPrefix: com.tiebax
  deploymentTarget:
    iOS: "14.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 14.0
targets:
  TieBaX:
    type: application
    platform: iOS
    sources:
      - TiebaPure
      - path: LICENSE
        buildPhase: resources
      - path: LICENSES/SwiftProtobuf-Apache-2.0.txt
        buildPhase: resources
    resources:
      - TiebaPure/Resources/Assets.xcassets
      - TiebaPure/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - target: TieBaXOpenIn
        embed: true
      - package: SwiftProtobuf
      - sdk: SwiftData.framework
        weak: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiebax.ios
        PRODUCT_NAME: TieBa-X
        PRODUCT_MODULE_NAME: TiebaPure
        INFOPLIST_FILE: TiebaPure/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  TieBaXOpenIn:
    type: app-extension
    platform: iOS
    sources:
      - path: TiebaPureOpenIn
        excludes:
          - Info.plist
          - OpenInTiebaPure.js
      - path: TiebaPure/App/ExternalRoute.swift
      - path: TiebaPure/App/SafariActionPayload.swift
      - path: TiebaPureOpenIn/OpenInTiebaPure.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tiebax.ios.open-in
        PRODUCT_NAME: TieBa-X-OpenIn
        INFOPLIST_FILE: TiebaPureOpenIn/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  TieBaXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TiebaPureTests
    dependencies:
      - target: TieBaX
      - package: SwiftProtobuf
      - sdk: SwiftData.framework
        weak: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TieBaXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TiebaPureUITests
    dependencies:
      - target: TieBaX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TieBaX:
    build:
      targets:
        TieBaX: all
        TieBaXTests: [test]
        TieBaXUITests: [test]
    test:
      targets:
        - TieBaXTests
        - TieBaXUITests
